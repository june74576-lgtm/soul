<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <!-- index.html y profile.html - Añadir en <head> -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Cpath d='M 100 12 C 155 15, 185 50, 188 100 C 190 150, 155 185, 100 188 C 45 190, 12 150, 12 100 C 10 50, 45 12, 100 12 Z' fill='%23111'/%3E%3Cpath d='M 130 55 Q 115 42 95 48 Q 72 55 70 75 Q 68 95 90 105 Q 115 115 122 130 Q 130 148 108 155 Q 85 162 68 148' fill='none' stroke='%23fff' stroke-width='13' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOUL</title>
    <link rel="stylesheet" href="styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="auth-container">

        <!-- ===== LOGIN ===== -->
        <div class="auth-box" id="login-box">
            <div class="auth-logo">
                <h1>SOUL</h1>
                <p>Your identity in cards</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn-primary">Sign In</button>
                <p class="auth-switch">
                    Don't have an account? <span id="show-register">Create one</span>
                </p>
                <div id="login-error" class="auth-error"></div>
            </form>
        </div>

        <!-- ===== REGISTER ===== -->
        <div class="auth-box hidden" id="register-box">
            <div class="auth-logo">
                <h1>SOUL</h1>
                <p>Your identity in cards</p>
            </div>

            <form id="register-form">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="register-username" placeholder="soul_user" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="register-email" placeholder="you@example.com" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="register-password" placeholder="••••••••" required />
                </div>
                <button type="submit" class="btn-primary">Create Account</button>
                <p class="auth-switch">
                    Already have an account? <span id="show-login">Sign in</span>
                </p>
                <div id="register-error" class="auth-error"></div>
            </form>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
